<form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="form-horizontal">
 <input type="hidden" name="mode" value="update">
 <input type="hidden" name="tab" value="settings">
 <input type="hidden" name="view_mode" value="update_settings">
 <fieldset>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_PIPER#></label>
   <div class="col-lg-6">
    <input type="text" name="piper_bin" value="[#PIPER_BIN#]" class="form-control">
   </div>
  </div>
[#if IS_REMOTE=""#]
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_MODELS_DIR#></label>
   <div class="col-lg-6">
    <input type="text" name="models_dir" value="[#MODELS_DIR#]" class="form-control" onchange="document.frmEdit.submit()">
   </div>
  </div>
[#endif#]
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_MODEL#></label>
   <div class="col-lg-6">
    <select name="model" class="form-control">
[#if IS_REMOTE="1"#]
[#begin REMOTE_MODELS#]
     <option value="[#VALUE#]" [#SELECTED#]>[#TITLE#]</option>
[#end REMOTE_MODELS#]
[#else#]
[#begin MODELS#]
     <option value="[#VALUE#]" [#SELECTED#]>[#TITLE#]</option>
[#end MODELS#]
[#endif#]
    </select>
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_LENGTH_SCALE#></label>
   <div class="col-lg-6">
    <input type="range" name="length_scale" min="0.5" max="1.5" step="0.01" value="[#LENGTH_SCALE#]" class="form-control" oninput="document.getElementById('lbl_length_scale').textContent=this.value" style="display:inline-block;width:calc(100% - 50px);vertical-align:middle">
    <span id="lbl_length_scale" style="display:inline-block;width:40px;text-align:center;font-weight:bold">[#LENGTH_SCALE#]</span>
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_SENTENCE_SILENCE#></label>
   <div class="col-lg-6">
    <input type="range" name="sentence_silence" min="0" max="0.5" step="0.01" value="[#SENTENCE_SILENCE#]" class="form-control" oninput="document.getElementById('lbl_sentence_silence').textContent=this.value" style="display:inline-block;width:calc(100% - 50px);vertical-align:middle">
    <span id="lbl_sentence_silence" style="display:inline-block;width:40px;text-align:center;font-weight:bold">[#SENTENCE_SILENCE#]</span>
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_LEAD_SILENCE#></label>
   <div class="col-lg-6">
    <input type="range" name="lead_silence" min="0" max="3" step="0.1" value="[#LEAD_SILENCE#]" class="form-control" oninput="document.getElementById('lbl_lead_silence').textContent=this.value" style="display:inline-block;width:calc(100% - 50px);vertical-align:middle">
    <span id="lbl_lead_silence" style="display:inline-block;width:40px;text-align:center;font-weight:bold">[#LEAD_SILENCE#]</span>
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4" for="piper_test_text"><#LANG_PIPER_TTS_TEST#></label>
   <div class="col-lg-6">
    <textarea id="piper_test_text" class="form-control" rows="2">В Москве сейчас около +9°C, пасмурно, ощущается как +7°. Ветер слабый (~1,5 м/с), влажность высокая (~86%). На сегодня: облачно, местами слабый дождь, днём +8…+11°.</textarea>
    <button type="button" class="btn btn-default" style="margin-top:8px" onclick="piperTestSay();return false"><span class="glyphicon glyphicon-volume-up"></span> <#LANG_PIPER_TTS_TEST_BTN#></button>
    <button type="button" class="btn btn-default" style="margin-top:8px" onclick="piperTestExplain();return false"><span class="glyphicon glyphicon-search"></span> <#LANG_PIPER_TTS_EXPLAIN#></button>
    <div style="margin-top:6px"><span id="piper_test_status"></span></div>
    <div id="piper_test_explain"></div>
    <span class="help-block" style="margin:6px 0 0"><#LANG_PIPER_TTS_TEST_HINT#></span>
   </div>
  </div>
  <div class="form-group">
   <div class="col-lg-offset-4 col-lg-6">
    <div class="checkbox">
     <label><input type="checkbox" name="use_cache" value="1" [#USE_CACHE#] onchange="document.getElementById('cache_cleanup_wrap').style.display=this.checked?'':'none'"> <#LANG_PIPER_TTS_USE_CACHE#></label>
    </div>
   </div>
  </div>
  <div class="form-group" id="cache_cleanup_wrap"[#if USE_CACHE=""#] style="display:none"[#endif#]>
   <div class="col-lg-offset-4 col-lg-6">
    <div class="checkbox">
     <label><input type="checkbox" name="cache_cleanup" value="1" [#CACHE_CLEANUP#]> <#LANG_PIPER_TTS_CACHE_CLEANUP#></label>
    </div>
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_CACHE_DIR#></label>
   <div class="col-lg-6">
    <input type="text" name="cache_dir" value="[#CACHE_DIR#]" class="form-control">
   </div>
  </div>
  <div class="form-group">
   <label class="control-label col-lg-4"><#LANG_PIPER_TTS_WS_PORT#></label>
   <div class="col-lg-6">
    <input type="text" name="ws_port" value="[#WS_PORT#]" class="form-control" style="max-width:120px">
   </div>
  </div>
 </fieldset>
 <div class="form-actions">
  <input type="submit" name="submit" value="<#LANG_UPDATE#>" class="btn btn-primary">
 </div>
  <script>
  document.getElementById('lbl_length_scale').textContent=document.getElementsByName('length_scale')[0].value;
  document.getElementById('lbl_sentence_silence').textContent=document.getElementsByName('sentence_silence')[0].value;
  document.getElementById('lbl_lead_silence').textContent=document.getElementsByName('lead_silence')[0].value;
  </script>
  <script>
  // «Проверка»: голос и параметры берём прямо со страницы — сохранять не обязательно.
  var piperTestAudio=null;
  function piperTestParams(){
   var p='',m=document.getElementsByName('model')[0];
   if(m&&m.value)p+='&model='+encodeURIComponent(m.value);
   var ls=document.getElementsByName('length_scale')[0];
   if(ls&&ls.value)p+='&length_scale='+encodeURIComponent(ls.value);
   var ss=document.getElementsByName('sentence_silence')[0];
   if(ss&&ss.value)p+='&sentence_silence='+encodeURIComponent(ss.value);
   var lsd=document.getElementsByName('lead_silence')[0];
   if(lsd&&lsd.value)p+='&lead_silence='+encodeURIComponent(lsd.value);
   return p;
  }
  function piperTestText(){var ta=document.getElementById('piper_test_text');return ta?ta.value:'';}
  function piperTestSay(){
   var st=document.getElementById('piper_test_status');
   var text=piperTestText();
   if(!/\S/.test(text||''))return;
   if(st){st.style.color='';st.textContent='…';}
   var x=new XMLHttpRequest();
   x.open('GET','/admin.php?action=piper_tts&cmd=test_say&t64='+piperB64(text)+piperTestParams()+'&_='+Date.now(),true);
   x.onload=function(){var r=null;try{r=JSON.parse(x.responseText)}catch(e){}
    if(!r||!r.ok){if(st){st.style.color='#dc3545';st.textContent='<#LANG_PIPER_TTS_TEST_FAIL#>'+(r&&r.error?': '+r.error:'');}return}
    if(st)st.textContent='';
    if(piperTestAudio)piperTestAudio.pause();
    piperTestAudio=new Audio(r.audio);
    var pr=piperTestAudio.play();
    if(pr&&pr.catch)pr.catch(function(){if(st){st.style.color='#dc3545';st.textContent='<#LANG_PIPER_TTS_TEST_FAIL#>: '+r.audio;}});};
   x.onerror=function(){if(st){st.style.color='#dc3545';st.textContent='<#LANG_PIPER_TTS_TEST_FAIL#>: HTTP';}};
   x.send();
  }
  function piperTestExplain(){
   var st=document.getElementById('piper_test_status'),box=document.getElementById('piper_test_explain');
   var text=piperTestText();
   if(!/\S/.test(text||''))return;
   piperExplain('&t64='+piperB64(text)+piperTestParams(),box,st);
  }
  </script>
</form>
